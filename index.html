<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go Chat Test</title>

    <style>
      body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 2rem auto;
      }
      #chat {
        height: 300px;
        border: 1px solid #ccc;
        overflow-y: scroll;
        margin-bottom: 1rem;
        padding: 10px;
        background: #fafafa;
      }
      .msg {
        margin-bottom: 8px;
      }
      .time {
        font-size: 0.8em;
        color: #888;
      }
      input,
      button {
        padding: 8px;
        margin: 4px 0;
      }
    </style>
  </head>
  <body>
    <h2>Go Clean Architecture Chat</h2>

    <div id="setup">
      <input type="text" id="username" placeholder="Username" value="user1" />
      <input type="text" id="room" placeholder="Room ID" value="general" />
      <button onclick="connect()">Join Chat</button>
    </div>

    <div id="chat-ui" style="display: none">
      <div id="chat"></div>
      <form id="msg-form" onsubmit="sendMessage(event)">
        <input
          type="text"
          id="msg-text"
          placeholder="Type a message..."
          autocomplete="off"
          style="width: 70%"
        />
        <button type="submit">Send</button>
      </form>
    </div>

    <script>
      let ws;
      let userId;

      function connect() {
        userId = document.getElementById("username").value;
        const roomId = document.getElementById("room").value;

        if (!userId || !roomId) return alert("Need username and room!");

        ws = new WebSocket(
          `ws://${window.location.host}/ws?user_id=${userId}&room_id=${roomId}`,
        );

        ws.onopen = () => {
          document.getElementById("setup").style.display = "none";
          document.getElementById("chat-ui").style.display = "block";
          appendMessage("System", "Connected to room: " + roomId);
        };

        ws.onmessage = (e) => {
          const msg = JSON.parse(e.data);
          appendMessage(msg.user_id, msg.content, msg.created_at);
        };

        ws.onclose = () => appendMessage("System", "Disconnected from server.");
        ws.onerror = (err) => console.error("WS Error:", err);
      }

      function sendMessage(e) {
        e.preventDefault();
        if (!ws) return;
        const input = document.getElementById("msg-text");
        if (input.value.trim() === "") return;

        ws.send(input.value);
        input.value = "";
      }

      function appendMessage(user, content, timestamp) {
        const chat = document.getElementById("chat");
        const div = document.createElement("div");
        div.className = "msg";
        const timeStr = timestamp
          ? new Date(timestamp).toLocaleTimeString()
          : "";
        div.innerHTML = `<span class="time">[${timeStr}]</span> <strong>${user}:</strong> ${content}`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      }
    </script>
  </body>
</html>
